name: Cadastro público - regressão
on:
  pull_request:
    paths:
      - 'routes/cadastro_publico.py'
      - 'templates/cadastro_visitante_publico.html'
      - 'tests/test_cadastro_publico.py'
      - 'tests/test_security_gate.py'
      - 'tests/test_zapi_webhook.py'
      - 'routes/webhooks.py'
      - 'servicos/saudacoes.py'
      - 'servicos/processamento_mensagens.py'
      - 'servicos/fila_mensagens.py'
      - 'tests/test_saudacao_reply_meta.py'
      - 'crmlogic.py'
      - '.github/workflows/cadastro-publico-tests.yml'
  workflow_dispatch:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependências mínimas
        run: pip install Flask==3.0.3 pytest==8.3.4
      - name: Testes do cadastro
        run: python -m pytest -q tests/test_cadastro_publico.py
      - name: Saudação conversacional (regressão)
        run: python -m pytest -q tests/test_saudacao_reply_meta.py
      - name: Webhook Z-API isolado
        run: python -m pytest -q tests/test_zapi_webhook.py
      - name: Auditoria de segurança (bloqueia merge)
        run: python -m pytest -q tests/test_security_gate.py
