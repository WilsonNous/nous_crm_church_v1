name: Agendamento - offline
on:
  pull_request:
    paths:
      - 'routes/agendamentos.py'
      - 'templates/agendar_espacos.html'
      - 'templates/admin_reservas.html'
      - 'templates/agenda_geral.html'
      - 'tests/test_agendamento_*.py'
      - '.github/workflows/agendamento-offline.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Flask PyMySQL requests
      - run: python -m py_compile routes/agendamentos.py
      - run: python -m unittest discover -s tests -p 'test_agendamento_*.py' -v
