name: Monitor - testes de regressão
on:
  pull_request:
    paths:
      - 'routes/app_monitor.py'
      - 'tests/test_monitor_logging.py'
      - '.github/workflows/monitor-regression.yml'
  workflow_dispatch:
jobs:
  monitor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_monitor_logging.py' -v
